<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>My Movies</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{background:#000;color:#fff;font-family:Arial}
    #app{max-width:600px;margin:auto;padding-bottom:80px}
    .top-bar{height:55px;display:flex;justify-content:space-between;align-items:center;padding:0 16px;background:#000;position:fixed;top:0;left:50%;transform:translateX(-50%);width:100%;max-width:600px;z-index:50;border-bottom:1px solid #111}
    .logo{font-size:24px;font-weight:900}.logo b{color:#e50914}.logo span{color:#fff}
    .hero{margin-top:55px;height:200px;background:linear-gradient(to bottom,rgba(0,0,0,.2),#000),url('https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?w=600&q=80') center/cover;display:flex;justify-content:center;align-items:center}
    .hero h1{font-size:38px;font-weight:900}
    .movies-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:14px 10px}
    .movie-card{text-align:center;position:relative}
    .poster{width:100%;aspect-ratio:2/3;object-fit:cover;border-radius:14px;background:#111;display:block}
    .favorite-btn{position:absolute;top:8px;left:8px;width:30px;height:30px;border-radius:50%;border:none;background:rgba(0,0,0,.6);color:#fff}
    .favorite-btn.active{color:#e50914}
    .movie-card h3{font-size:15px;font-weight:800;margin-top:8px;min-height:36px;line-height:18px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
    .movie-card p{font-size:12px;color:#777;margin-top:4px}
    .bottom-nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:600px;height:78px;background:#080808;border-top:1px solid #1a1a1a;display:flex;justify-content:space-around;align-items:center}
    .bottom-nav button{background:none;border:none;color:#555;display:flex;flex-direction:column;align-items:center;gap:5px;font-size:22px;padding:6px 12px;border-radius:10px;border:2px solid transparent}
    .bottom-nav button span{font-size:11px}
    .bottom-nav button.active{color:#e50914;border-color:#e50914}
    .input{width:100%;background:#151515;color:#fff;border:1px solid #333;border-radius:10px;padding:12px}
    .back-btn{margin:12px;background:#1a1a1a;border:1px solid #333;color:#fff;padding:8px 14px;border-radius:20px}
    .episode-btn{width:100%;background:#151515;color:#fff;border:1px solid #2a2a2a;border-radius:10px;padding:14px;display:flex;justify-content:space-between}
    .drop-zone{display:block;border:2px dashed #444;border-radius:10px;padding:16px;text-align:center;color:#bbb;background:#0f0f0f;cursor:pointer;position:relative;touch-action:manipulation;user-select:none;-webkit-tap-highlight-color:rgba(229,9,20,0.2)}
    .drop-zone:active{border-color:#e50914;background:#191919}
    .media-preview-box{margin-top:10px;text-align:center;display:none}
    .media-preview-box img{max-width:140px;aspect-ratio:2/3;object-fit:cover;border-radius:8px;border:1px solid #333;display:inline-block}
    .media-preview-box video{width:100%;max-height:220px;border-radius:8px;background:#000;border:1px solid #333;display:inline-block}
    .video-player-container{margin-top:12px;background:#000;border-radius:10px;overflow:hidden;border:1px solid #222;position:relative;min-height:220px;display:flex;align-items:center;justify-content:center}
    .video-error-banner{display:none;background:#1a0505;border:1px solid #e50914;color:#ff8888;padding:16px;border-radius:8px;margin-top:12px;text-align:right;font-size:14px;line-height:1.6}
    .video-error-banner b{color:#fff}
    @keyframes spin{to{transform:rotate(360deg)}}
  </style>
  <script type="importmap">
  {
    "imports": {
      "firebase/app": "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js",
      "firebase/firestore": "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js"
    }
  }
  </script>
</head>
<body>
  <div id="app">
    <header class="top-bar">
      <button onclick="openSearch()" style="background:none;border:none;font-size:22px">🔍</button>
      <div class="logo"><b>MY</b><span>MOVIES</span></div>
    </header>
    <main id="main-content">
      <div style="padding:60px;text-align:center;color:#555">⏳ تحميل...</div>
    </main>
    <nav class="bottom-nav">
      <button onclick="showPage('home')" id="nav-home" class="active">⌂<span>الرئيسية</span></button>
      <button onclick="showPage('movies')" id="nav-movies">🎬<span>أفلام</span></button>
      <button onclick="showPage('series')" id="nav-series">📺<span>مسلسل</span></button>
      <button onclick="showPage('anime')" id="nav-anime">⚡<span>أنمي</span></button>
      <button onclick="renderAddPage()" id="nav-add">＋<span>إضافة</span></button>
      <button onclick="showPage('favorites')" id="nav-favorites">♥<span>مفضلتي</span></button>
    </nav>
  </div>

  <script type="module">
    import { initializeApp } from "firebase/app";
    import { getFirestore, collection, onSnapshot, addDoc, updateDoc, deleteDoc, doc, serverTimestamp, query, orderBy, limit } from "firebase/firestore";

    const firebaseConfig = {
      apiKey: "AIzaSyB_9ZOotR4uZtYYn08OSIZXJczM-WC0MM8",
      authDomain: "hamza-4b70c.firebaseapp.com",
      projectId: "hamza-4b70c",
      storageBucket: "hamza-4b70c.firebasestorage.app",
      messagingSenderId: "595903053058",
      appId: "1:595903053058:web:3745c8d9876284a4d4561b"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const colRef = collection(db, "movies");

    const REWARDED_ID = "ca-app-pub-8410578267301371/4181816334";

    window.isAdminUnlocked = false;
    window.deleteMode = false;
    window.selectEpisodeMode = false;
    window.allContent = [];
    window.currentPage = "home";
    window.historyStack = [];
    window.favorites = JSON.parse(localStorage.getItem("favorites") || "[]");
    window.main = document.getElementById("main-content");
    window.tempVideoData = "";
    window.tempPosterData = "";

    const q = query(colRef, orderBy("createdAt", "desc"), limit(50));
    onSnapshot(q, (s) => {
      window.allContent = s.docs.map(d => ({ firebaseId: d.id, ...d.data() }));
      renderCurrentPage();
    });

    window.getItemByFirebaseId = (fid) => window.allContent.find(i => i.firebaseId === fid);
    window.isFavorite = (id) => window.favorites.includes(id);

    window.toggleFavorite = (id) => {
      if (window.isFavorite(id)) window.favorites = window.favorites.filter(x => x !== id);
      else window.favorites.push(id);
      localStorage.setItem("favorites", JSON.stringify(window.favorites));
      renderCurrentPage();
    };

    window.setActiveNav = (p) => {
      document.querySelectorAll(".bottom-nav button").forEach(b => b.classList.remove("active"));
      let n = document.getElementById("nav-" + p);
      if (n) n.classList.add("active");
    };

    window.getTypeLabel = (t) => t === "movie" ? "فيلم" : t === "series" ? "مسلسل" : "أنمي";

    window.createCard = (item) => {
      let fav = window.isFavorite(item.id);
      let click = window.selectEpisodeMode ? `renderAddEpisodeForm('${item.firebaseId}')` : window.deleteMode ? `askDeleteMovie('${item.firebaseId}')` : `openDetails('${item.firebaseId}')`;
      let del = window.deleteMode ? `<button style="position:absolute;top:6px;right:6px;width:22px;height:22px;border-radius:50%;border:none;background:#e50914;color:#fff;z-index:3" onclick="event.stopPropagation();askDeleteMovie('${item.firebaseId}')">✕</button>` : "";
      return `<div class="movie-card"><button class="favorite-btn ${fav ? "active" : ""}" onclick="event.stopPropagation();toggleFavorite('${item.id}')">♥</button>${del}<div onclick="${click}"><img class="poster" src="${item.poster}" loading="lazy"><h3>${item.title}</h3><p>${item.year} • ${getTypeLabel(item.type)}</p></div></div>`;
    };

    window.renderHome = () => {
      main.innerHTML = `<div class="hero"><h1>MY MOVIES</h1></div><div class="movies-grid">${window.allContent.map(createCard).join("")}</div>`;
      setActiveNav("home");
    };

    window.renderCategory = (type) => {
      let items = window.allContent.filter(x => x.type === type);
      let title = type === "movie" ? "أفلام" : type === "series" ? "مسلسلات" : "أنمي";
      main.innerHTML = `<div class="hero" style="height:100px"><h1 style="font-size:26px">${title}</h1></div><div class="movies-grid">${items.length ? items.map(createCard).join("") : `<p style="grid-column:1/4;padding:30px;text-align:center;color:#555">لا يوجد ${title} بعد</p>`}</div>`;
      setActiveNav(type === "movie" ? "movies" : type);
    };

    window.openDetails = (fid) => {
      let item = getItemByFirebaseId(fid);
      if (!item) return;
      historyStack.push({ type: "page", page: currentPage });
      currentPage = "details";
      let addEpBtn = isAdminUnlocked ? `<button class="episode-btn" style="border:1px dashed #444;color:#aaa" onclick="renderAddEpisodeForm('${item.firebaseId}')">➕ إضافة حلقة</button>` : "";
      main.innerHTML = `<button class="back-btn" onclick="goBack()">← رجوع</button><div style="padding:15px;text-align:center"><img src="${item.poster}" style="width:180px;aspect-ratio:2/3;object-fit:cover;border-radius:12px"><h1 style="margin-top:12px">${item.title}</h1><p style="color:#888">${item.year} • ${getTypeLabel(item.type)}</p><p style="color:#aaa;margin-top:10px">${item.description}</p></div><div style="padding:12px;display:flex;flex-direction:column;gap:8px">${item.episodes.map((ep, idx) => `<button class="episode-btn" onclick="watchEpisode('${item.firebaseId}',${idx})"><b>${ep.title}</b><span>▶</span></button>`).join("")}${addEpBtn}</div>`;
    };

    // ====== نظام الإعلان الحقيقي فقط - 7 ثواني ======
    window.watchEpisode = (fid, idx) => {
      historyStack.push({ type: "details", id: fid });
      localStorage.setItem("last_fid", fid);
      localStorage.setItem("last_idx", idx);
      main.innerHTML = `
        <div style="background:#000;height:70vh;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:20px;text-align:center">
          <div style="width:60px;height:60px;border:4px solid #1a1a1a;border-top-color:#e50914;border-radius:50%;animation:spin 1s linear infinite"></div>
          <h3 id="adStatus" style="margin-top:18px">جاري تحضير الفيديو...</h3>
          <p id="adTimer" style="color:#e50914;font-size:44px;font-weight:900;margin-top:10px">7</p>
        </div>`;
      let c = 7;
      let it = setInterval(() => {
        c--;
        let el = document.getElementById("adTimer");
        if (el) el.innerText = c;
        if (c <= 0) {
          clearInterval(it);
          if (window.Android && window.Android.showRewarded) {
            try { window.Android.showRewarded(REWARDED_ID); }
            catch (e) { playRealVideo(fid, idx); }
          } else {
            playRealVideo(fid, idx);
          }
        }
      }, 1000);
    };

    window.onRewardedAdClosed = () => {
      let fid = localStorage.getItem("last_fid");
      let idx = localStorage.getItem("last_idx");
      playRealVideo(fid, idx);
    };

    window.onAdFailed = () => {
      let fid = localStorage.getItem("last_fid");
      let idx = localStorage.getItem("last_idx");
      playRealVideo(fid, idx);
    };

    // التمييز التلقائي بين أنواع مصادر الفيديو
    window.getVideoSourceType = (str) => {
      if (!str) return "empty";
      let s = str.trim();
      if (/^https?:\/\//i.test(s)) return "direct_url";
      if (/^blob:/i.test(s)) return "local_blob";
      if (/^data:video\//i.test(s)) return "local_data";
      return "invalid";
    };

    // تشغيل الفيديو الفعلي باستخدام HTML5 video المباشر
    window.playRealVideo = (fid, idx) => {
      let item = getItemByFirebaseId(fid);
      if (!item) {
        item = window.allContent.find(x => x.id === fid || x.firebaseId === fid);
      }
      if (!item) {
        main.innerHTML = `<button class="back-btn" onclick="showPage('home')">← الرئيسية</button><div style="padding:40px;text-align:center;color:#888">تعذر العثور على العمل المطلوب</div>`;
        return;
      }

      let episodeIndex = parseInt(idx, 10);
      if (isNaN(episodeIndex)) episodeIndex = 0;
      let ep = (item.episodes && item.episodes[episodeIndex]) ? item.episodes[episodeIndex] : null;

      if (!ep) {
        main.innerHTML = `<button class="back-btn" onclick="openDetails('${item.firebaseId}')">← رجوع</button><div style="padding:40px;text-align:center;color:#888">الحلقة غير متوفرة</div>`;
        return;
      }

      let savedVideoUrl = (ep.video || "").trim();
      let sourceType = getVideoSourceType(savedVideoUrl);

      main.innerHTML = `
        <button class="back-btn" onclick="openDetails('${item.firebaseId}')">← رجوع</button>
        <div style="padding:12px">
          <h2>${ep.title}</h2>
          <div class="video-player-container">
            <video id="videoPlayer" playsinline style="width:100%;max-height:70vh;background:#000;display:block"></video>
            <div id="videoSpinner" style="display:none;position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,0.75);padding:14px 20px;border-radius:10px;text-align:center;z-index:2">
              <div style="width:36px;height:36px;border:3px solid #333;border-top-color:#e50914;border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 8px"></div>
              <span id="videoSpinnerText" style="font-size:12px;color:#eee">جاري التحميل...</span>
            </div>
          </div>
          <div id="videoErrorBanner" class="video-error-banner"></div>
        </div>`;

      const video = document.getElementById("videoPlayer");
      const errBanner = document.getElementById("videoErrorBanner");
      const spinner = document.getElementById("videoSpinner");
      const spinnerText = document.getElementById("videoSpinnerText");

      function showVideoError(msg) {
        if (spinner) spinner.style.display = "none";
        if (errBanner) {
          errBanner.style.display = "block";
          errBanner.innerHTML = `
            <b>⚠️ تنبيه في التشغيل:</b><br>
            ${msg}
            <div style="margin-top:8px;font-size:12px;color:#aaa;direction:ltr;text-align:left;word-break:break-all">
              ${savedVideoUrl}
            </div>`;
        }
      }

      if (!savedVideoUrl || sourceType === "empty") {
        showVideoError("لا يوجد رابط فيديو متوفر لهذا العرض.");
        return;
      }

      if (sourceType === "invalid") {
        showVideoError("تعذر تشغيل الفيديو. تأكد أن الرابط مباشر ويدعم تشغيل الفيديو عبر المتصفح.");
        return;
      }

      if (video) {
        // معالجة الأحداث:
        // 1. loadedmetadata
        video.addEventListener("loadedmetadata", () => {
          if (spinner) spinner.style.display = "none";
          if (errBanner) errBanner.style.display = "none";
        });

        // 2. waiting
        video.addEventListener("waiting", () => {
          if (spinner) {
            spinner.style.display = "block";
            if (spinnerText) spinnerText.innerText = "جاري التخزين المؤقت...";
          }
        });

        // 3. stalled
        video.addEventListener("stalled", () => {
          if (spinner) {
            spinner.style.display = "block";
            if (spinnerText) spinnerText.innerText = "توقف التحميل مؤقتاً، بانتظار استجابة الخادم...";
          }
        });

        video.addEventListener("canplay", () => {
          if (spinner) spinner.style.display = "none";
        });

        video.addEventListener("playing", () => {
          if (spinner) spinner.style.display = "none";
          if (errBanner) errBanner.style.display = "none";
        });

        // 4. error
        video.addEventListener("error", () => {
          if (spinner) spinner.style.display = "none";
          let err = video.error;
          let reason = "تعذر تشغيل الفيديو. تأكد أن الرابط مباشر ويدعم تشغيل الفيديو عبر المتصفح.";
          if (err) {
            switch (err.code) {
              case 1:
                reason = "تم إلغاء تحميل الفيديو من قبل المتصفح.";
                break;
              case 2:
                reason = "خطأ في الشبكة أثناء جلب الفيديو. تأكد من اتصال الإنترنت وصلاحية الرابط.";
                break;
              case 3:
                reason = "فشل فك تشفير الفيديو (تأكد أن صيغة الفيديو مدعومة مثل MP4 أو WebM).";
                break;
              case 4:
                reason = "تعذر تشغيل الفيديو. تأكد أن الرابط مباشر ويدعم تشغيل الفيديو عبر المتصفح.";
                break;
            }
          }
          showVideoError(reason);
        });

        // تطبيق المطلوب نصاً:
        video.src = savedVideoUrl;
        video.preload = "metadata";
        video.controls = true;
        video.load();

        let playPromise = video.play();
        if (playPromise !== undefined) {
          playPromise.catch((e) => {
            console.log("Play interrupted or requires user action:", e);
          });
        }
      }
    };

    window.openSearch = () => {
      historyStack.push({ type: "page", page: currentPage });
      currentPage = "search";
      main.innerHTML = `<button class="back-btn" onclick="goBack()">← رجوع</button><div style="padding:12px"><input id="searchInput" class="input" placeholder="ابحث..." oninput="performSearch()"></div><div id="searchResults" class="movies-grid"></div>`;
    };

    window.performSearch = () => {
      let qq = document.getElementById("searchInput").value.toLowerCase();
      document.getElementById("searchResults").innerHTML = window.allContent.filter(x => x.title.toLowerCase().includes(qq)).map(createCard).join("");
    };

    window.renderFavorites = () => {
      let favs = window.allContent.filter(x => favorites.includes(x.id));
      main.innerHTML = `<div class="hero" style="height:100px"><h1 style="font-size:26px">مفضلتي ♥</h1></div><div class="movies-grid">${favs.map(createCard).join("")}</div>`;
      setActiveNav("favorites");
    };

    window.showPage = (p, s = true) => {
      if (s && currentPage !== p) historyStack.push({ type: "page", page: currentPage });
      currentPage = p;
      window.selectEpisodeMode = false;
      if (p === "home") renderHome();
      else if (["movies", "series", "anime", "movie"].includes(p)) renderCategory(p === "movies" ? "movie" : p);
      else if (p === "favorites") renderFavorites();
      window.scrollTo(0, 0);
    };

    window.renderCurrentPage = () => {
      if (currentPage === "home") renderHome();
      else if (["movies", "series", "anime", "movie"].includes(currentPage)) renderCategory(currentPage === "movies" ? "movie" : currentPage);
      else if (currentPage === "favorites") renderFavorites();
      else if (currentPage === "add") renderAddPage();
    };

    window.goBack = () => {
      if (!historyStack.length) { showPage("home", false); return; }
      let l = historyStack.pop();
      if (l.type === "page") showPage(l.page, false);
      else openDetails(l.id);
    };

    window.renderAddPage = () => {
      setActiveNav("add");
      currentPage = "add";
      if (!isAdminUnlocked) {
        main.innerHTML = `
          <h1 style="padding:20px">محمي 🔒</h1>
          <div style="padding:20px;max-width:340px;margin:auto;display:flex;flex-direction:column;gap:14px">
            <input id="adminCode" class="input" type="password" placeholder="أدخل رمز هنا..">
            <button onclick="if(document.getElementById('adminCode').value==='hamza otmani'){isAdminUnlocked=true;renderAddPage()}else{alert('رمز غير صحيح')}" style="background:#e50914;color:#fff;border:none;padding:13px;border-radius:10px">فتح</button>
          </div>`;
        return;
      }

      main.innerHTML = `
        <h1 style="padding:16px">لوحة التحكم</h1>
        <div style="padding:12px;display:flex;flex-direction:column;gap:10px">
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
            <button onclick="startSelectEpisodeMode()" style="background:#fff;color:#000;border:none;padding:12px;border-radius:10px;font-weight:bold">📺 إضافة حلقة</button>
            <button onclick="toggleDeleteMode()" style="background:${deleteMode ? '#fff' : '#e50914'};color:${deleteMode ? '#000' : '#fff'};border:none;padding:12px;border-radius:10px;font-weight:bold">${deleteMode ? 'إلغاء' : '🗑️ حذف'}</button>
          </div>
          <button onclick="lockAddPage()" style="background:#1a1a1a;color:#888;border:1px solid #333;padding:9px;border-radius:8px">🔒 قفل</button>
          <hr style="border-color:#1f1f1f">
          <select id="addType" class="input">
            <option value="movie">فيلم</option>
            <option value="series">مسلسل</option>
            <option value="anime">أنمي</option>
          </select>
          <input id="addTitle" class="input" placeholder="العنوان">
          <input id="addYear" class="input" type="number" placeholder="السنة">
          <input id="addPoster" class="input" placeholder="رابط الصورة أو اختر من الهاتف أدناه">
          
          <!-- خانة اختيار أو إضافة صورة أو فيديو للملصق -->
          <label class="drop-zone" for="posterFile">
            📷 إضافة فيديو أو صورة (الملصق)
            <input type="file" id="posterFile" accept="image/*,video/*" style="display:none" onchange="handlePosterFile(this.files[0])">
            <div id="posterPreview" class="media-preview-box"></div>
          </label>

          <input id="addVideo" class="input" placeholder="رابط الفيديو (مثل: https://pixeldrain.com/api/file/...) أو اختر ملفاً">
          
          <!-- خانة اختيار أو إضافة فيديو أو صورة للفيلم -->
          <label class="drop-zone" for="videoFile">
            🎬 إضافة فيديو أو صورة (ملف الفيديو)
            <input type="file" id="videoFile" accept="image/*,video/*" style="display:none" onchange="handleVideoFile(this.files[0])">
            <div id="videoPreview" class="media-preview-box"></div>
          </label>

          <input id="addDesc" class="input" placeholder="الوصف">
          <button id="addBtn" onclick="addNewContent()" style="background:#e50914;color:#fff;border:none;padding:13px;border-radius:10px;font-weight:bold">إضافة</button>
        </div>`;
    };

    window.handlePosterFile = (f) => {
      if (!f) return;
      let preview = document.getElementById("posterPreview");
      let isVideo = f.type.startsWith("video/") || /\.(mp4|webm|mkv|mov|avi|3gp)$/i.test(f.name);
      let url = URL.createObjectURL(f);

      preview.style.display = "block";
      if (isVideo) {
        preview.innerHTML = `
          <div style="color:#0f0;font-size:12px;margin-bottom:6px">✅ تم اختيار الفيديو: ${f.name}</div>
          <video controls playsinline src="${url}"></video>`;
        window.tempPosterData = url;
      } else {
        preview.innerHTML = `
          <div style="color:#0f0;font-size:12px;margin-bottom:6px">✅ تم اختيار الصورة: ${f.name}</div>
          <img src="${url}">`;
        if (f.size <= 2 * 1024 * 1024) {
          let r = new FileReader();
          r.onload = e => { window.tempPosterData = e.target.result; };
          r.readAsDataURL(f);
        } else {
          window.tempPosterData = url;
        }
      }
    };

    window.handleVideoFile = (f) => {
      if (!f) return;
      let preview = document.getElementById("videoPreview");
      let isVideo = f.type.startsWith("video/") || /\.(mp4|webm|mkv|mov|avi|3gp)$/i.test(f.name);
      let url = URL.createObjectURL(f);

      preview.style.display = "block";
      if (isVideo) {
        preview.innerHTML = `
          <div style="color:#0f0;font-size:12px;margin-bottom:6px">✅ تم اختيار الفيديو: ${f.name}</div>
          <video controls playsinline src="${url}"></video>`;
      } else {
        preview.innerHTML = `
          <div style="color:#0f0;font-size:12px;margin-bottom:6px">✅ تم اختيار الصورة: ${f.name}</div>
          <img src="${url}">`;
      }

      // لا نقوم بتحويل الفيديو إلى Base64 لتفادي استهلاك الذاكرة وحجم المستند في Firestore
      // بل نستخدم Blob URL المباشر
      window.tempVideoData = url;
    };

    window.lockAddPage = () => {
      isAdminUnlocked = false;
      deleteMode = false;
      showPage("home");
    };

    window.toggleDeleteMode = () => {
      deleteMode = !deleteMode;
      selectEpisodeMode = false;
      renderAddPage();
      showPage("movies", false);
    };

    window.startSelectEpisodeMode = () => {
      selectEpisodeMode = true;
      deleteMode = false;
      main.innerHTML = `<h1 style="padding:16px">اختر فيلم</h1><div class="movies-grid">${window.allContent.map(createCard).join("")}</div>`;
    };

    window.addNewContent = async () => {
      let type = document.getElementById("addType").value,
          title = document.getElementById("addTitle").value.trim(),
          year = document.getElementById("addYear").value || 2024,
          posterInput = document.getElementById("addPoster").value.trim(),
          poster = posterInput || window.tempPosterData,
          videoInput = document.getElementById("addVideo").value.trim(),
          // تخزين رابط الفيديو فقط دون تحويله إلى Base64 أو تنزيله
          video = videoInput || window.tempVideoData,
          desc = document.getElementById("addDesc").value.trim() || "بدون وصف";

      if (!title || !poster) {
        alert("العنوان والصورة ضروري");
        return;
      }

      let btn = document.getElementById("addBtn");
      btn.disabled = true;
      btn.innerText = "⏳ جاري...";
      try {
        await addDoc(colRef, {
          id: type + "-" + Date.now(),
          title,
          year: parseInt(year),
          type,
          description: desc,
          poster,
          // تخزين الرابط النصي فقط
          episodes: [{ title: "الفيلم كامل", video }],
          createdAt: serverTimestamp()
        });
        window.tempPosterData = "";
        window.tempVideoData = "";
        setTimeout(() => showPage("home"), 600);
      } catch (e) {
        alert(e.message);
        btn.disabled = false;
      }
    };

    window.renderAddEpisodeForm = (fid) => {
      let item = getItemByFirebaseId(fid);
      if (!item) return;
      window.selectEpisodeMode = false;
      historyStack.push({ type: "page", page: "add" });
      main.innerHTML = `
        <button class="back-btn" onclick="renderAddPage()">← رجوع</button>
        <div style="padding:15px;text-align:center">
          <img src="${item.poster}" style="width:100px;aspect-ratio:2/3;object-fit:cover;border-radius:8px">
          <h2>${item.title}</h2>
        </div>
        <div style="padding:12px;display:flex;flex-direction:column;gap:10px;background:#111;margin:8px;border-radius:10px;border:1px solid #222">
          <input id="epTitle" class="input" placeholder="عنوان الحلقة">
          <input id="epVideoLink" class="input" placeholder="رابط الفيديو (مثل: https://pixeldrain.com/api/file/...) أو اختر ملفاً">
          
          <label class="drop-zone" for="epVideoFile">
            🎬 إضافة فيديو أو صورة (الحلقة)
            <input type="file" id="epVideoFile" accept="image/*,video/*" style="display:none" onchange="handleEpVideoFile(this.files[0])">
            <div id="epVideoPreview" class="media-preview-box"></div>
          </label>

          <button onclick="addEpisode('${item.firebaseId}')" style="background:#fff;color:#000;border:none;padding:12px;border-radius:8px;font-weight:bold">✅ إضافة</button>
        </div>`;
    };

    window.handleEpVideoFile = (f) => {
      if (!f) return;
      let preview = document.getElementById("epVideoPreview");
      let isVideo = f.type.startsWith("video/") || /\.(mp4|webm|mkv|mov|avi|3gp)$/i.test(f.name);
      let url = URL.createObjectURL(f);

      preview.style.display = "block";
      if (isVideo) {
        preview.innerHTML = `
          <div style="color:#0f0;font-size:12px;margin-bottom:6px">✅ تم اختيار الفيديو: ${f.name}</div>
          <video controls playsinline src="${url}"></video>`;
      } else {
        preview.innerHTML = `
          <div style="color:#0f0;font-size:12px;margin-bottom:6px">✅ تم اختيار الصورة: ${f.name}</div>
          <img src="${url}">`;
      }

      window.tempVideoData = url;
    };

    window.addEpisode = async (fid) => {
      let t = document.getElementById("epTitle").value.trim(),
          videoInput = document.getElementById("epVideoLink").value.trim(),
          l = videoInput || window.tempVideoData;
      if (!t || !l) {
        alert("عمر البيانات");
        return;
      }
      let item = getItemByFirebaseId(fid);
      let ne = [...item.episodes, { title: t, video: l }];
      await updateDoc(doc(db, "movies", fid), { episodes: ne });
      window.tempVideoData = "";
      alert("✅ تمت");
      openDetails(fid);
    };

    window.askDeleteMovie = async (fid) => {
      if (confirm("حذف نهائي؟")) {
        await deleteDoc(doc(db, "movies", fid));
        renderCurrentPage();
      }
    };
  </script>
</body>
</html>
